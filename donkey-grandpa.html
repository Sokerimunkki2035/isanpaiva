<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaari Aasi</title>
    <style>
        body { background: #e3f2fd; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        button { width: 100%; padding: 20px; border-radius: 15px; border: none; font-size: 18px; font-weight: bold; background: #4a90e2; color: white; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>🫏 Vaari Aasi</h2>
    <p>Paina nappia ja juttele vaarille.</p>
    <button id="micBtn">🎤 PUHU</button>
    <div id="status" style="margin: 10px 0; color: #666;"></div>
    <div id="log" style="font-style: italic; color: #555; margin-top: 15px;"></div>
    <a href="index.html" style="display:block; margin-top:20px; color:#999; text-decoration:none;">← Takaisin valikkoon</a>
</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const synth = window.speechSynthesis;
    let recognition;

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'fi-FI';
    }

    micBtn.onclick = () => {
        synth.speak(new SpeechSynthesisUtterance("")); // Bluetooth herätys
        recognition.start();
        status.innerText = "Vaari kuuntelee...";
    };

    recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        log.innerText = "Sinä: " + text;
        status.innerText = "Vaari miettii...";
        
        const key = localStorage.getItem('openrouter_key');

        try {
            const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key.trim()}`,
                    'HTTP-Referer': window.location.origin
                },
                body: JSON.stringify({
                    model: "google/gemini-2.0-flash-001",
                    messages: [
                        { role: "system", content: "Olet Vaari Aasi, vanha, hieman hidas mutta viisas ja ystävällinen aasi. Vastaa suomeksi vaarin tyyliin." },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await resp.json();
            const aiText = data.choices[0].message.content;
            
            setTimeout(() => {
                const speak = new SpeechSynthesisUtterance(aiText);
                speak.lang = 'fi-FI';
                speak.onend = () => { status.innerText = ""; };
                synth.speak(speak);
            }, 300);
        } catch (err) { status.innerText = "Virhe."; }
    };
</script>
</body>
</html>
